name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Java ${{ matrix.java }} / jOOQ ${{ matrix.jooq }}
    runs-on: ubuntu-latest

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/test_db
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres

    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '17'
            jooq: 3.14.16
          - java: '21'
            jooq: 3.14.16
          - java: '17'
            jooq: 3.19.10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test (jOOQ ${{ matrix.jooq }})
        run: mvn -B -ntp test -Djooq.version=${{ matrix.jooq }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-java${{ matrix.java }}-jooq${{ matrix.jooq }}
          path: target/surefire-reports/
          if-no-files-found: ignore
