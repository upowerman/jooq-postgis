# 发布到 Maven Central（Sonatype Central Portal）
#
# 触发：推送形如 1.0.10 的 tag（与仓库既有 tag 风格一致，无 v 前缀）
# 手动：Actions 页面 Run workflow，不勾 publish 则只做「打包 + 签名」干跑，不上传
#
# 仓库 Secrets 需要配置 4 个：
#   CENTRAL_USERNAME   Central Portal 用户名
#   CENTRAL_TOKEN      Central Portal 用户令牌（不是登录密码）
#   GPG_PRIVATE_KEY    私钥全文（ASCII armor）
#   GPG_PASSPHRASE     私钥密码短语
name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      publish:
        description: '勾选 = 真正上传到 Central；不勾 = 只做打包+签名干跑'
        type: boolean
        default: false

permissions:
  contents: read

# 发布串行化：两个 tag 并发会撞 Central 的版本占用，直接失败
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 用 JDK 17 构建：pom 里 maven.compiler.release=8 保证产物仍是 Java 8 字节码，
      # 而 JDK 8 的 javadoc 不支持 --release（插件会把 release=8 转成 --release 8），
      # 用 JDK 8 会在 maven-javadoc-plugin 阶段直接失败。
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Toolchain versions
        run: |
          java -version
          ./mvnw -v

      # 防呆：tag 和 pom 版本不一致时直接失败
      - name: Verify tag matches pom version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          pom_version = ET.parse('pom.xml').getroot().findtext('m:version', namespaces=ns)
          tag = os.environ['GITHUB_REF'].replace('refs/tags/', '', 1)

          print('pom version = %s' % pom_version)
          print('git tag     = %s' % tag)
          if tag != pom_version:
              raise SystemExit('::error::tag %s 与 pom 版本 %s 不一致，拒绝发布' % (tag, pom_version))
          PY

      - name: Import GPG private key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "--- 已导入的私钥 ---"
          gpg --list-secret-keys --keyid-format=long

      # 只写 Central 凭据；runner 直连 Central，不配镜像
      - name: Write ~/.m2/settings.xml
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>central</id>
                <username>${CENTRAL_USERNAME}</username>
                <password>${CENTRAL_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      # 干跑：走完 package/verify（含 sources、javadoc、GPG 签名），但不 deploy
      - name: Dry run (package + sign only)
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B -ntp -Prelease verify -Dgpg.passphrase="$GPG_PASSPHRASE"

      - name: Publish to Maven Central
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B -ntp -Prelease deploy -Dgpg.passphrase="$GPG_PASSPHRASE"

      # 上传失败时把待发布的 bundle 留档，便于定位 Central 侧校验问题
      - name: Upload bundle for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: central-bundle
          path: target/central-publishing/central-bundle.zip
          if-no-files-found: warn
          retention-days: 3
